<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img">
  <title>Aletheia — Local Evidence Layer for AI Coding Agents</title>
  <defs>
    <radialGradient id="sc-mesh" cx="75%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#B392F0" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#79B8FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sc-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79B8FF"/>
      <stop offset="35%" stop-color="#B392F0"/>
      <stop offset="70%" stop-color="#F97583"/>
      <stop offset="100%" stop-color="#FFAB70"/>
    </linearGradient>
    <linearGradient id="sc-check" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#79B8FF"/>
      <stop offset="100%" stop-color="#B392F0"/>
    </linearGradient>
    <pattern id="sc-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Dark Obsidian Base -->
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <rect width="1200" height="630" fill="url(#sc-mesh)"/>
  <rect width="1200" height="630" fill="url(#sc-dots)"/>
  <rect x="1" y="1" width="1198" height="628" rx="15" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Brand Mark -->
  <g transform="translate(80, 70)">
    <rect x="2" y="2" width="60" height="60" rx="16" fill="#14141C"/>
    <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="url(#sc-rim)" stroke-width="1.5" stroke-opacity="0.9"/>
    <path d="M18 46 L32 15 L46 46" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22.5 37 L41.5 37" stroke="#9DB1C5" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M23 35 L31 43 L48 24" stroke="url(#sc-check)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="44" font-family="Geist, sans-serif" font-size="36" font-weight="500" letter-spacing="-1.5" fill="#FFFFFF">aletheia<tspan fill="#B392F0">.</tspan></text>
  </g>

  <!-- Tagline -->
  <g transform="translate(80, 165)">
    <rect width="250" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#sc-rim)" stroke-opacity="0.4"/>
    <circle cx="14" cy="14" r="3.5" fill="#79B8FF"/>
    <text x="26" y="18" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.5" fill="#B392F0">LOCAL SUPERVISION</text>
  </g>

  <!-- Headline -->
  <g transform="translate(80, 260)">
    <text x="0" y="0" font-family="Geist, sans-serif" font-size="64" font-weight="500" letter-spacing="-2" fill="#FFFFFF">Less blind trust.</text>
    <text x="0" y="74" font-family="Geist, sans-serif" font-size="64" font-weight="500" letter-spacing="-2" fill="#B392F0">More proof.</text>
  </g>

  <text x="80" y="390" font-family="Geist, sans-serif" font-size="22" font-weight="400" fill="#9DB1C5">Your agents build. Aletheia checks the work.</text>
  <text x="80" y="425" font-family="Geist, sans-serif" font-size="16" font-weight="400" fill="#9DB1C5" fill-opacity="0.7">Independent checks · Bounded recovery · Inspectable evidence</text>

  <!-- Right Visual Liquid Glass Badge -->
  <g transform="translate(740, 160)">
    <rect width="360" height="340" rx="16" fill="#111118" fill-opacity="0.8"/>
    <rect x="0.75" y="0.75" width="358.5" height="338.5" rx="15.25" stroke="url(#sc-rim)" stroke-width="1.5"/>
    
    <g transform="translate(30, 32)">
      <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" fill="#79B8FF">// SUPERVISION LOOP</text>
      <text x="0" y="36" font-family="Geist, sans-serif" font-size="20" font-weight="500" fill="#FFFFFF">Verification Evidence</text>
      
      <g transform="translate(0, 56)">
        <rect width="300" height="180" rx="10" fill="#0A0A0E" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <text x="16" y="32" font-family="JetBrains Mono, monospace" font-size="12" fill="#79B8FF">1. pytest -q</text>
        <text x="16" y="52" font-family="JetBrains Mono, monospace" font-size="11" fill="#9DB1C5">   ✓ 42 passed (1.28s)</text>
        <text x="16" y="80" font-family="JetBrains Mono, monospace" font-size="12" fill="#79B8FF">2. mypy src</text>
        <text x="16" y="100" font-family="JetBrains Mono, monospace" font-size="11" fill="#9DB1C5">   ✓ 0 type errors</text>
        <text x="16" y="128" font-family="JetBrains Mono, monospace" font-size="12" fill="#79B8FF">3. git diff --check</text>
        <text x="16" y="148" font-family="JetBrains Mono, monospace" font-size="11" fill="#B392F0">   ✓ clean boundary</text>
      </g>
    </g>
  </g>
</svg>

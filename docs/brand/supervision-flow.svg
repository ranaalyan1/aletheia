<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" fill="none" role="img">
  <title>Observe, verify, recover, resolve — liquid glass supervision flow</title>
  <defs>
    <linearGradient id="flow-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79B8FF"/>
      <stop offset="35%" stop-color="#B392F0"/>
      <stop offset="70%" stop-color="#F97583"/>
      <stop offset="100%" stop-color="#FFAB70"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="290" rx="16" fill="#0A0A0A"/>
  <rect x="0.75" y="0.75" width="1198.5" height="288.5" rx="15.25" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Eyebrow -->
  <text x="38" y="44" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="2" fill="#B392F0">FROM AGENT ACTIVITY TO INSPECTABLE EVIDENCE</text>

  <!-- Step 01: Observe -->
  <g transform="translate(38, 72)">
    <rect width="254" height="142" rx="14" fill="#12121A" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="24" y="32" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" fill="#79B8FF">01</text>
    <text x="24" y="68" font-family="Geist, sans-serif" font-size="22" font-weight="500" fill="#FFFFFF">Observe</text>
    <text x="24" y="98" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#9DB1C5">Supported agent activity</text>
    <text x="24" y="120" font-family="JetBrains Mono, monospace" font-size="11" fill="#9DB1C5" fill-opacity="0.7">Claude Code · Codex · OpenCode</text>
  </g>
  <path d="M302 143h16m-5-5 5 5-5 5" stroke="#B392F0" stroke-width="2"/>

  <!-- Step 02: Verify (Highlighted liquid glass) -->
  <g transform="translate(328, 72)">
    <rect width="254" height="142" rx="14" fill="#141422"/>
    <rect x="0.75" y="0.75" width="252.5" height="140.5" rx="13.25" stroke="url(#flow-rim)" stroke-width="1.5"/>
    <text x="24" y="32" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" fill="#B392F0">02 · NON-NEGOTIABLE</text>
    <text x="24" y="68" font-family="Geist, sans-serif" font-size="22" font-weight="500" fill="#FFFFFF">Verify</text>
    <text x="24" y="98" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#9DB1C5">Your configured checks</text>
    <text x="24" y="120" font-family="JetBrains Mono, monospace" font-size="11" fill="#79B8FF">pytest · mypy · diff checks</text>
  </g>
  <path d="M592 143h16m-5-5 5 5-5 5" stroke="#B392F0" stroke-width="2"/>

  <!-- Step 03: Recover -->
  <g transform="translate(618, 72)">
    <rect width="254" height="142" rx="14" fill="#12121A" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="24" y="32" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" fill="#FFAB70">03</text>
    <text x="24" y="68" font-family="Geist, sans-serif" font-size="22" font-weight="500" fill="#FFFFFF">Recover</text>
    <text x="24" y="98" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#9DB1C5">Retain, restore, retry</text>
    <text x="24" y="120" font-family="JetBrains Mono, monospace" font-size="11" fill="#9DB1C5" fill-opacity="0.7">Saved checkpoints &amp; diffs</text>
  </g>
  <path d="M882 143h16m-5-5 5 5-5 5" stroke="#B392F0" stroke-width="2"/>

  <!-- Step 04: Resolve -->
  <g transform="translate(908, 72)">
    <rect width="254" height="142" rx="14" fill="#12121A" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="24" y="32" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" fill="#F97583">04</text>
    <text x="24" y="68" font-family="Geist, sans-serif" font-size="22" font-weight="500" fill="#FFFFFF">Resolve</text>
    <text x="24" y="98" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#9DB1C5">Verified or flagged</text>
    <text x="24" y="120" font-family="JetBrains Mono, monospace" font-size="11" fill="#9DB1C5" fill-opacity="0.7">Zero unverified promises</text>
  </g>

  <!-- Footnote -->
  <text x="38" y="254" font-family="Geist, sans-serif" font-size="13" font-weight="400" fill="#9DB1C5" fill-opacity="0.6">Conceptual flow • observation and recovery capabilities depend on the configured integration.</text>
</svg>

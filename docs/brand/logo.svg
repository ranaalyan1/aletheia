<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img">
  <title>Aletheia — Liquid Glass Evidence Monogram</title>
  <defs>
    <linearGradient id="rim-dispersion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79B8FF"/>
      <stop offset="35%" stop-color="#B392F0"/>
      <stop offset="70%" stop-color="#F97583"/>
      <stop offset="100%" stop-color="#FFAB70"/>
    </linearGradient>
    <linearGradient id="glass-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="50%" stop-color="#101016"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="specular-lens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="check-cyan-violet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#79B8FF"/>
      <stop offset="100%" stop-color="#B392F0"/>
    </linearGradient>
    <filter id="liquid-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Ambient soft glow behind glass tile -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="#B392F0" opacity="0.2" filter="url(#liquid-glow)"/>
  <!-- Liquid Glass Base Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#glass-body)"/>
  <!-- Chromatic dispersion rim border -->
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="url(#rim-dispersion)" stroke-width="1.5" stroke-opacity="0.9"/>
  <!-- Curved liquid glass specular refraction lens -->
  <path d="M4 18 C 4 8, 8 4, 18 4 L 46 4 C 56 4, 60 8, 60 18 C 48 26, 16 26, 4 18 Z" fill="url(#specular-lens)"/>
  <!-- Architectural 'A' Letterform -->
  <path d="M18 46 L32 15 L46 46" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 'A' crossbar highlight -->
  <path d="M22.5 37 L41.5 37" stroke="#9DB1C5" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Rising verification checkmark with chromatic violet/cyan glow -->
  <path d="M23 35 L31 43 L48 24" stroke="#79B8FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="url(#liquid-glow)"/>
  <path d="M23 35 L31 43 L48 24" stroke="url(#check-cyan-violet)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
